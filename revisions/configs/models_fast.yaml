# Default model set for Experiment 1 (joint measurement): "a small, fast set".
#
# Both are paper models, so the joint ΔC can be put next to the published steering ΔC for the
# same items. Scale up with --config revisions/configs/models_paper.yaml once the small set
# looks right.

models:
  - model_name: "meta-llama/Llama-3.2-1B-Instruct"
    shorthand: "llama1b"
    quantized: false
    assistant: true

  - model_name: "Qwen/Qwen2.5-7B-Instruct"
    shorthand: "qwen"
    quantized: false
    assistant: true
